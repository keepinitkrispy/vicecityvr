<!doctype html><meta charset="utf-8"><title>pipeline harness</title><canvas id="gl" width="1280" height="720"></canvas>
<script>
// Runs the app's real shader files on a synthetic scene with known motion, and measures the result.
const W = 1280, H = 720, FW = 160, FH = 90, DW = 64, DH = 36;
const gl = document.getElementById('gl').getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');
const SH = '../app/assets/shaders/';

let P = {}, T = {}, model = null, work = { full: 0, used: 0 }, st = { cur: 0, rawCur: 0, stateCur: 0, hasPrev: 0, flowValid: 0, base: 0.01, cuts: 0, dups: 0, frames: 0 };
const S = { tanV: 0.08 /* synthetic scene = narrow-angle camera: turns shift the picture uniformly */, gateThr: 0.12, sharp: 0.5, deblock: 0.5, horizon: 0.42, nearcap: 0.6, conv: 0.4, hudAuto: 1, skyK: 0.7, rate: 0.12, evK: 1, cut: 0.5 };

  let i = 0; for (const k in binds) { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, binds[k]); gl.uniform1i(pr.u[k], i++); }

const mip = t => { gl.bindTexture(gl.TEXTURE_2D, t.t); gl.generateMipmap(gl.TEXTURE_2D); };
async function init() {

  gl.bindVertexArray(gl.createVertexArray());
  T.in = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, T.in); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  T.raw = [tex(W, H), tex(W, H)]; T.src = [tex(W, H, 0, 1), tex(W, H, 0, 1)]; T.diff = tex(DW, DH); T.one = tex(1, 1);
  T.flow = [tex(FW, FH, 1, 1), tex(FW, FH, 1, 1)]; T.flowS = tex(FW, FH, 1, 1); T.flowP = tex(FW, FH, 1, 1); T.state = [tex(FW, FH, 1), tex(FW, FH, 1)];
}
// one captured frame in -> 'dup' | 'cut' | 'frame'
function newFrame(canvas) {

  let cut = false;

    const px = new Uint8Array(DW * DH * 4); gl.readPixels(0, 0, DW, DH, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let sum = 0, changed = 0; for (let i = 0; i < px.length; i += 4) { sum += px[i]; changed += px[i + 1] ? 1 : 0; }

  if (st.hasPrev) {
    const fl = (out, init, lod, r, hasInit, gateT) => pass(P.flow, out, { cur: cur.t, prev: prev.t, init: init.t, gateTex: (gateT || init).t }, u => {
      gl.uniform2f(u.srcSize, W, H); gl.uniform1f(u.lod, lod); gl.uniform1f(u.radius, r); gl.uniform1f(u.hasInit, hasInit);

    gl.uniform1f(u.hasPrev, st.hasPrev); gl.uniform1f(u.cut, havePair ? 0 : 1); gl.uniform1f(u.horizon, S.horizon); gl.uniform1f(u.nearcap, S.nearcap); gl.uniform1f(u.conv, S.conv);

}
// Fit the 6-number camera model to all cells: weighted least squares, then one robust reweighting pass so

  let th = null;

function solve(A, b) {

function direct(t) {   // predicted picture t game-frames ahead, no stereo

    gl.uniform2f(u.res, W, H); gl.uniform1f(u.sbs, 3); gl.uniform1f(u.bright, 1); gl.uniform1f(u.depthK, 0); gl.uniform1f(u.conv, S.conv); gl.uniform1f(u.flowT, st.flowValid ? t : 0); });

// ---------------- synthetic scene with known motion ----------------
const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d', { willReadFrequently: true });

const HZ = 300, POST = [200, 620, 1040], MIDX = 460, FARX = 760;

function scene(X, R, seed = 1) {   // X: sideways camera travel (px at depth 1), R: camera turn (px)

    for (let k = 0; k < 14; k++) { const x = wrap(r() * (W + 60) + sh, 60); c.fillStyle = r() > 0.5 ? '#3b3d42' : '#8a8f6a'; c.fillRect(x, y, 30 + r() * 30, 6); } }
  for (let k = -1; k < 3; k++) strip(wrap(MIDX + k * 640 + X / 3 + R, 240), 120, 240, 250, seed * 50 + ((k + 9) % 4), 20);                          // mid, depth 3

  // screen-locked HUD

  c.fillStyle = '#4fd1ff'; c.beginPath(); c.moveTo(110, 590); c.lineTo(90, 640); c.lineTo(130, 640); c.fill();

}
function truth(X, R, seed) { scene(X, R, seed); return c.getImageData(0, 0, W, H).data; }   // row 0 = top
function mae(glpx, top) { let s = 0, n = 0; for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) { const a = ((H - 1 - y) * W + x) * 4, b = (y * W + x) * 4; s += Math.abs(glpx[a] - top[b]) + Math.abs(glpx[a + 1] - top[b + 1]) + Math.abs(glpx[a + 2] - top[b + 2]); n += 3; } return s / n; }
const inside = (xs, lo, hi) => xs.find(x => x > lo && x < hi);

const clear = (xs, posts, half) => { for (const x0 of xs) for (let d = 0; d <= half - 15; d += 5) for (const x of [x0 - d, x0 + d]) if (x > 150 && x < 1130 && posts.every(p => Math.abs(p - x) > 60)) return x; throw new Error('no clear sample point'); };
