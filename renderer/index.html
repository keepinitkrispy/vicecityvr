<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSVR Stereo Renderer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 14px/1.35 system-ui, sans-serif; color: #e8e8e8; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #panel { position: fixed; top: 8px; left: 8px; bottom: 8px; width: min(420px, calc(100vw - 16px)); overflow-y: auto;
           background: rgba(18,20,24,.92); border: 1px solid #333; border-radius: 10px; padding: 10px 12px; box-sizing: border-box; }
  #panel.hidden { display: none; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #8fb3ff; margin: 14px 0 4px; }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 2px 8px; align-items: center; margin: 4px 0; }
  .row label { grid-column: 1 / 3; font-size: 12px; color: #bbb; }
  .row input[type=range] { width: 100%; }
  .row output { font-variant-numeric: tabular-nums; text-align: right; font-size: 12px; }
  button, select, input[type=text] { font: inherit; background: #2a2f38; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 9px; margin: 2px 2px 2px 0; }
  button.primary { background: #2f5fd0; border-color: #2f5fd0; }
  input[type=text] { width: 100%; box-sizing: border-box; }
  #status { font-size: 12px; color: #9c9; white-space: pre-wrap; margin-top: 6px; }
  .hint { font-size: 12px; color: #999; }
  video, img#mjpeg { display: none; }
  [hidden] { display: none !important; }
</style>
<canvas id="c"></canvas>
<div id="panel">
  <h1>PSVR Stereo Renderer</h1>
  <div class="hint">Double-tap the screen or press H to show/hide this panel. Mute button on the headset cable recenters; volume buttons change 3D strength.</div>
  <h2>Source</h2>
  <select id="srcSel">
    <option value="testfp">Test scene: first-person (HUD, gun, look-back)</option>
    <option value="test">Test scene: third-person driving</option>
    <option value="url">MJPEG stream URL (Remote Play via ScreenStream)</option>
    <option value="camera">Capture card / camera</option>
    <option value="file">Video file</option>
  </select>
  <div id="urlBox" style="display:none"><input type="text" id="srcUrl" placeholder="http://192.168.x.x:8080/stream.mjpeg"><button id="urlGo">Connect</button></div>
  <div id="camBox" style="display:none"><select id="camSel"></select><button id="camGo">Open</button></div>
  <div id="fileBox" style="display:none"><input type="file" id="srcFile" accept="video/*"></div>
  <h2>Go</h2>
  <button class="primary" id="startBtn">Start (fullscreen)</button>
  <button id="recenterBtn">Recenter</button>
  <button data-preset="theater">Theater</button><button data-preset="cockpit">Cockpit</button><button data-preset="imax">IMAX</button>
  <h2 id="hdHead">Headset (needs psvrd)</h2>
  <button data-usb="vr">VR mode</button><button data-usb="cinematic">Cinematic</button><button data-usb="power_off">Headset off</button><button id="recalBtn">Recalibrate IMU</button>
  <div id="sliders"></div>
  <h2>Reset</h2>
  <button id="resetBtn">Reset all settings</button>
  <div id="status"></div>
</div>
<video id="vid" playsinline muted autoplay loop></video>
<img id="mjpeg" alt="">
<script>
// Shared settings schema for the renderer (index.html) and the remote control page (control.html).
// [key, label, min, max, step, default, group]
window.SCHEMA = [
  ['depth',   '3D strength (0 = identical image to both eyes)', 0, 2.5, 0.05, 1.0, 'Depth'],
  ['profile', 'Game camera: 0 third-person · 1 first-person · 2 generic', 0, 2, 1, 1, 'Depth'],
  ['horizon', 'Horizon height (ground-plane disparity)', 0.15, 0.85, 0.01, 0.45, 'Depth'],
  ['nearcap', 'Max pop-out (hands / gun / car bonnet)', 0, 1, 0.05, 0.6, 'Depth'],
  ['hudauto', 'Auto-flatten screen-locked HUD', 0, 1, 1, 1, 'Depth'],
  ['cut',     'Cut detection (R3 look-back, camera switch)', 0, 1, 0.05, 0.5, 'Depth'],
  ['conv',    'Screen plane (0 = all pops out, 1 = all sinks in)', 0, 1, 0.05, 0.4, 'Depth'],
  ['sky',     'Push sky / distance back',    0,    1,    0.05, 0.7,  'Depth'],
  ['subject', 'Pop the player/car forward',  0,    1,    0.05, 0.5,  'Depth'],
  ['smooth',  'Depth smoothing (anti-shimmer)', 0, 0.97, 0.01, 0.85, 'Depth'],
  ['hud',     'Also flatten HUD corners (fixed mask)', 0, 1, 1, 0, 'Depth'],
  ['ml',      'AI depth blend (phone model, optional)', 0, 1, 0.05, 0, 'Depth'],

  ['dist',    'Screen distance (m)',         0.8,  8,    0.1,  2.6,  'Screen'],
  ['width',   'Screen width (degrees)',      30,   150,  1,    84,   'Screen'],
  ['curve',   'Curvature',                   0.02, 1,    0.02, 0.6,  'Screen'],
  ['follow',  'Screen follows your head',    0,    1,    0.05, 0.0,  'Screen'],
  ['ambient', 'Peripheral glow (vection)',   0,    1,    0.05, 0.55, 'Screen'],
  ['floor',   'Floor / room grounding',      0,    1,    0.05, 0.3,  'Screen'],
  ['bright',  'Brightness',                  0.5,  1.6,  0.01, 1.0,  'Screen'],

  ['warp',    'Lens correction on',          0,    1,    1,    1,    'Lens'],
  ['swap',    'Swap eyes',                   0,    1,    1,    0,    'Lens'],
  ['fov',     'Lens FOV scale',              0.4,  1.3,  0.01, 0.8,  'Lens'],
  ['k1',      'Lens K1',                     0,    0.7,  0.01, 0.22, 'Lens'],
  ['k2',      'Lens K2',                     0,    0.7,  0.01, 0.24, 'Lens'],
  ['ca',      'Colour fringe fix',           0,    0.05, 0.001,0.012,'Lens'],
  ['ipd',     'IPD (mm)',                    54,   76,   0.5,  63,   'Lens'],
  ['lensx',   'Lens centre X',               -0.2, 0.2,  0.005,0,    'Lens'],
  ['lensy',   'Lens centre Y',               -0.2, 0.2,  0.005,0,    'Lens'],
  ['fill16',  'HDMI is 16:9 (mirror letterbox fix)', 0, 1, 1, 1,   'Lens'],
  ['grid',    'Calibration grid',            0,    1,    1,    0,    'Lens'],
  ['lxo',     'Left eye X (px)',             -440, 440,  1,    0,    'Per-eye (from PSVR Alignment app)'],
  ['lyo',     'Left eye Y (px)',             -490, 490,  1,    0,    'Per-eye (from PSVR Alignment app)'],
  ['lsc',     'Left eye scale',              0.5,  1.6,  0.001,1,    'Per-eye (from PSVR Alignment app)'],
  ['rxo',     'Right eye X (px)',            -440, 440,  1,    0,    'Per-eye (from PSVR Alignment app)'],
  ['ryo',     'Right eye Y (px)',            -490, 490,  1,    0,    'Per-eye (from PSVR Alignment app)'],
  ['rsc',     'Right eye scale',             0.5,  1.6,  0.001,1,    'Per-eye (from PSVR Alignment app)'],

  ['predict', 'Head prediction (ms)',        0,    60,   1,    22,   'Tracking'],
  ['neck',    'Neck model',                  0,    1,    1,    1,    'Tracking'],
  ['invyaw',  'Invert yaw',                  0,    1,    1,    0,    'Tracking'],
  ['invpitch','Invert pitch',                0,    1,    1,    0,    'Tracking'],
  ['invroll', 'Invert roll',                 0,    1,    1,    0,    'Tracking'],
  ['sbs',     'Output: 0 flat · 1 PSVR headset · 2 cross-eye 3D', 0, 2, 1, 1, 'Tracking'],
];
window.PRESETS = {
  theater: { dist: 3.2, width: 70, curve: 0.4, follow: 0.0, ambient: 0.45, floor: 0.35 },
  cockpit: { dist: 1.7, width: 108, curve: 0.9, follow: 0.35, ambient: 0.7, floor: 0.15 },
  imax:    { dist: 5.0, width: 125, curve: 1.0, follow: 0.0, ambient: 0.8, floor: 0.2 },
};
</script>
<script>
'use strict';
// ------------------------------------------------------------------ settings
const LOCAL = location.port === '8765' || new URLSearchParams(location.search).has('ws');
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const LS_KEY = 'psvr3d.settings.v3';
const DEF = {}; SCHEMA.forEach(s => DEF[s[0]] = s[5]);
if (!LOCAL) DEF.sbs = 2; // standalone link: cross-eye 3D you can check on any screen
let S = Object.assign({}, DEF);
try { Object.assign(S, JSON.parse(lsGet(LS_KEY) || '{}')); } catch (e) {}
function save() { lsSet(LS_KEY, JSON.stringify(S)); }
const sliderEls = {};
(function buildSliders() {
  const box = document.getElementById('sliders'); let group = '';
  for (const [k, label, mn, mx, st, , g] of SCHEMA) {
    if (g !== group) { group = g; const h = document.createElement('h2'); h.textContent = g; box.appendChild(h); }
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label for="s_${k}">${label}</label><input type="range" id="s_${k}" min="${mn}" max="${mx}" step="${st}"><output></output>`;
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.value = S[k]; out.textContent = (+S[k]).toFixed(st < 1 ? (st < 0.01 ? 3 : 2) : 0);
    inp.addEventListener('input', () => { setKey(k, +inp.value, true); });
    sliderEls[k] = [inp, out, st];
    box.appendChild(row);
  }
})();
function setKey(k, v, fromUI) {
  if (!(k in DEF)) return;
  const sch = SCHEMA.find(s => s[0] === k); v = Math.min(sch[3], Math.max(sch[2], v));
  S[k] = v; save();
  const [inp, out, st] = sliderEls[k];
  if (!fromUI) inp.value = v;
  out.textContent = (+v).toFixed(st < 1 ? (st < 0.01 ? 3 : 2) : 0);
  if (fromUI) wsSend({ type: 'set', key: k, value: v });
}
function applyPreset(name) { const p = PRESETS[name]; if (!p) return; for (const k in p) setKey(k, p[k]); wsSend({ type: 'settings', S }); }
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => applyPreset(b.dataset.preset));
document.getElementById('resetBtn').onclick = () => { for (const k in DEF) setKey(k, DEF[k]); wsSend({ type: 'settings', S }); };

// ------------------------------------------------------------------ status
const statusEl = document.getElementById('status');
const st = { ws: 'off', imu: '-', src: '-', fps: 0, ml: 'off', usb: '-', cal: 'defaults', cuts: 0 };
function showStatus() { statusEl.textContent = `tracking: ${st.ws}  imu: ${st.imu}  headset: ${st.usb}\nsource: ${st.src}\nrender: ${st.fps} fps   ai-depth: ${st.ml}\ncalibration: ${st.cal}   cuts seen: ${st.cuts}`; }
setInterval(showStatus, 500);

// ------------------------------------------------------------------ websocket to psvrd
let ws = null, pose = null, poseT = 0;
function wsSend(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function wsConnect() {
  const qp = new URLSearchParams(location.search).get('ws');
  const url = qp || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  if (!qp && !location.host) { st.ws = 'n/a (open via psvrd)'; return; }
  try { ws = new WebSocket(url); } catch (e) { st.ws = 'error'; return; }
  ws.onopen = () => { st.ws = 'connected'; wsSend({ type: 'settings', S }); };
  ws.onclose = () => { st.ws = 'reconnecting'; pose = null; setTimeout(wsConnect, 2000); };
  ws.onerror = () => {};
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === 'pose') { pose = m; poseT = performance.now(); st.imu = m.cal ? 'ok' : 'calibrating (keep still)'; st.usb = m.status; }
    else if (m.type === 'recenter') recenter();
    else if (m.type === 'nudge') setKey(m.key, S[m.key] + m.delta);
    else if (m.type === 'set') setKey(m.key, m.value);
    else if (m.type === 'preset') applyPreset(m.name);
    else if (m.type === 'hello') wsSend({ type: 'settings', S });
  };
}
if (LOCAL) wsConnect(); else st.ws = 'off (run psvrd on the Pixel for head tracking)';
// per-eye calibration saved by the PSVR Alignment app (it POSTs to psvrd); same units and lens model
if (LOCAL) fetch('/calibration.json').then(r => r.json()).then(c => {
  if (!c || !c.eyes) return;
  const [L, R] = c.eyes;
  setKey('lxo', L.x); setKey('lyo', L.y); setKey('lsc', L.scale); setKey('rxo', R.x); setKey('ryo', R.y); setKey('rsc', R.scale);
  setKey('swap', c.swap ? 1 : 0); setKey('warp', c.warp ? 1 : 0);
  if (c.k1 != null) setKey('k1', c.k1); if (c.k2 != null) setKey('k2', c.k2);
  st.cal = 'loaded from alignment app';
}).catch(() => {});
document.querySelectorAll('[data-usb]').forEach(b => b.onclick = () => wsSend({ type: 'usb', cmd: b.dataset.usb }));
document.getElementById('recalBtn').onclick = () => wsSend({ type: 'recal' });

// ------------------------------------------------------------------ quaternions
const qmul = (a, b) => [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3], a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
                        a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1], a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
const qn = q => { const n = Math.hypot(...q) || 1; return q.map(c => c / n); };
const qaxis = (x, y, z, ang) => [Math.cos(ang/2), x*Math.sin(ang/2), y*Math.sin(ang/2), z*Math.sin(ang/2)];
function qmat(q) { // column-major mat3, body -> world
  const [w, x, y, z] = q;
  return [1-2*(y*y+z*z), 2*(x*y+w*z), 2*(x*z-w*y),
          2*(x*y-w*z), 1-2*(x*x+z*z), 2*(y*z+w*x),
          2*(x*z+w*y), 2*(y*z-w*x), 1-2*(x*x+y*y)];
}
const mulMV = (m, v) => [m[0]*v[0]+m[3]*v[1]+m[6]*v[2], m[1]*v[0]+m[4]*v[1]+m[7]*v[2], m[2]*v[0]+m[5]*v[1]+m[8]*v[2]];
const yawOf = q => { const m = qmat(q); return Math.atan2(m[6], m[8]); }; // forward = -col2
let recenterQ = [1, 0, 0, 0], lastRawQ = [1, 0, 0, 0];
function recenter() { recenterQ = qaxis(0, 1, 0, -yawOf(lastRawQ)); screenYaw = 0; }
document.getElementById('recenterBtn').onclick = recenter;

// mouse / touch-drag look (for testing without the headset)
let dragYaw = 0, dragPitch = 0, dragging = null;
const cvs = document.getElementById('c');
cvs.addEventListener('pointerdown', e => { dragging = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => dragging = null);
addEventListener('pointermove', e => { if (!dragging) return;
  dragYaw += (e.clientX - dragging[0]) * 0.004; dragPitch = Math.max(-1.4, Math.min(1.4, dragPitch + (e.clientY - dragging[1]) * 0.004));
  dragging = [e.clientX, e.clientY]; });
let lastTap = 0;
cvs.addEventListener('pointerup', () => { const t = performance.now(); if (t - lastTap < 300) togglePanel(); lastTap = t; });
const panel = document.getElementById('panel');
function togglePanel() { panel.classList.toggle('hidden'); }
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'h' || e.key === 'H') togglePanel();
  else if (e.key === 'r' || e.key === 'R') recenter();
  else if (e.key === 'f' || e.key === 'F') goFullscreen();
  else if (e.key === ']') setKey('depth', S.depth + 0.1, true);
  else if (e.key === '[') setKey('depth', S.depth - 0.1, true);
});
async function goFullscreen() {
  try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch (e) {}
  try { await screen.orientation.lock('landscape'); } catch (e) {}
  try { await navigator.wakeLock.request('screen'); } catch (e) {}
  panel.classList.add('hidden');
}
document.getElementById('startBtn').onclick = goFullscreen;

// ------------------------------------------------------------------ sources
const vid = document.getElementById('vid'), img = document.getElementById('mjpeg');
const testCanvas = document.createElement('canvas'); testCanvas.width = 1280; testCanvas.height = 720;
const tctx = testCanvas.getContext('2d');
let source = 'testfp', newFrame = true, srcW = 1280, srcH = 720;
const srcSel = document.getElementById('srcSel');
srcSel.onchange = () => {
  const v = srcSel.value;
  for (const [id, on] of [['urlBox', v === 'url'], ['camBox', v === 'camera'], ['fileBox', v === 'file']])
    document.getElementById(id).style.display = on ? '' : 'none';
  if (v === 'test' || v === 'testfp') source = v;
  if (v === 'camera') listCams();
  lsSet('psvr3d.src', v);
};
const savedUrl = lsGet('psvr3d.url'); if (savedUrl) document.getElementById('srcUrl').value = savedUrl;
document.getElementById('urlGo').onclick = () => {
  const u = document.getElementById('srcUrl').value.trim(); if (!u) return;
  lsSet('psvr3d.url', u);
  const viaProxy = location.port === '8765' && !u.startsWith(location.origin);
  img.crossOrigin = viaProxy ? null : 'anonymous';
  img.src = viaProxy ? '/proxy?u=' + encodeURIComponent(u) : u;
  source = 'img'; st.src = 'connecting ' + u;
};
img.onerror = () => { st.src = 'stream error (check URL / ScreenStream running / same Wi-Fi)'; };
async function listCams() {
  const sel = document.getElementById('camSel'); sel.innerHTML = '';
  try { const tmp = await navigator.mediaDevices.getUserMedia({ video: true }); tmp.getTracks().forEach(t => t.stop()); } catch (e) {}
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  devs.forEach((d, i) => { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || ('camera ' + i); sel.appendChild(o); });
  if (!devs.length) st.src = 'no video inputs visible to the browser';
}
document.getElementById('camGo').onclick = async () => {
  const id = document.getElementById('camSel').value;
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { deviceId: id ? { exact: id } : undefined, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } }, audio: false });
    vid.srcObject = s; await vid.play(); source = 'video';
  } catch (e) { st.src = 'camera error: ' + e.message; }
};
document.getElementById('srcFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  vid.srcObject = null; vid.src = URL.createObjectURL(f); await vid.play().catch(() => {}); source = 'video';
};
if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
  const cb = () => { newFrame = true; vid.requestVideoFrameCallback(cb); }; vid.requestVideoFrameCallback(cb);
}
{ const sv = LOCAL ? lsGet('psvr3d.src') : null; if (sv && sv !== 'test' && sv !== 'testfp') { srcSel.value = sv; srcSel.onchange(); if (sv === 'url' && savedUrl) document.getElementById('urlGo').click(); } }

// Procedural "driving" scene: gives the depth estimator the same cues a GTA frame has.
function drawTest(t, fp) {
  const W = 1280, H = 720, c = tctx, hz = 300;
  const back = fp && Math.floor(t / 8) % 2 === 1;            // first-person: every 8 s, an R3-style look-back cut
  const vx = 640 + Math.sin(t * 0.3) * (fp ? 260 : 40);      // first-person camera turns more
  if (back) { c.save(); c.translate(W, 0); c.scale(-1, 1); c.filter = 'hue-rotate(160deg) brightness(0.6) contrast(1.4)'; }
  let g = c.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#3d7ad8'); g.addColorStop(1, '#bcd6f2');
  c.fillStyle = g; c.fillRect(0, 0, W, hz);
  c.fillStyle = '#e9b97a'; c.beginPath(); c.arc(980, 120, 34, 0, 7); c.fill();
  c.fillStyle = '#5c6b4a'; c.fillRect(0, hz, W, H - hz);
  c.fillStyle = '#3b3d42'; c.beginPath(); c.moveTo(vx - 8, hz); c.lineTo(vx + 8, hz); c.lineTo(W * 0.95, H); c.lineTo(W * 0.05, H); c.fill();
  c.strokeStyle = '#f2e6a0'; c.lineWidth = 2;
  for (let i = 0; i < 14; i++) { const z = ((i + (t * 2.2) % 1) / 14); const y0 = hz + (H - hz) * z * z, y1 = hz + (H - hz) * Math.min(1, (z + 0.03) ** 2);
    const x0 = vx + (640 - vx) * z * z, x1 = vx + (640 - vx) * Math.min(1, (z + 0.03) ** 2); c.lineWidth = 1 + 8 * z * z; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); }
  for (let side = -1; side <= 1; side += 2) for (let i = 9; i >= 0; i--) {
    const z = ((i + (t * 0.8) % 1) / 10), s = 0.08 + z * z * 1.6;
    const bx = vx + side * (90 + 600 * z * z) - (side < 0 ? 200 * s : 0), bh = (180 + (i * 37) % 120) * s, by = hz - bh + 40 * z * z;
    c.fillStyle = `hsl(${(i * 47) % 360},18%,${38 + (i * 13) % 25}%)`; c.fillRect(bx, by, 200 * s, bh + 60 * s);
    c.fillStyle = 'rgba(255,240,200,.55)';
    for (let wy = 0; wy < 6; wy++) for (let wx = 0; wx < 4; wx++) c.fillRect(bx + (12 + wx * 46) * s, by + (12 + wy * (bh / s) / 6.5) * s, 22 * s, 14 * s);
  }
  if (back) c.restore();
  c.filter = 'none';
  if (fp) { drawFpOverlay(t); return; }
  const cx = 640 + Math.sin(t * 0.9) * 30, cy = 585;
  c.fillStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.ellipse(cx, cy + 62, 150, 22, 0, 0, 7); c.fill();
  c.fillStyle = '#b3172a'; c.fillRect(cx - 140, cy - 30, 280, 85); c.fillStyle = '#7d0f1d'; c.fillRect(cx - 100, cy - 75, 200, 50);
  c.fillStyle = '#9cc3e6'; c.fillRect(cx - 88, cy - 68, 176, 36);
  c.fillStyle = '#ff4646'; c.fillRect(cx - 132, cy - 10, 42, 16); c.fillRect(cx + 90, cy - 10, 42, 16);
  c.fillStyle = '#111'; c.fillRect(cx - 130, cy + 50, 50, 22); c.fillRect(cx + 80, cy + 50, 50, 22);
  c.fillStyle = 'rgba(10,10,10,.7)'; c.beginPath(); c.arc(110, 620, 80, 0, 7); c.fill();
  c.strokeStyle = '#ddd'; c.lineWidth = 3; c.stroke(); c.fillStyle = '#4fd1ff'; c.beginPath(); c.moveTo(110, 600); c.lineTo(100, 630); c.lineTo(120, 630); c.fill();
